route:
  receiver: healix
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: healix
    webhook_configs:
      - url: http://host.docker.internal:8000/v1/alerts/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials: local-dev-token

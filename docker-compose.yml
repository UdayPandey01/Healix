# Postgres is Neon, not a local container — see docs/ARCHITECTURE.md §7.
# core/.env supplies DATABASE_URL (pooled) and DIRECT_URL (unpooled, for migrations).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: healix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: healix-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: healix-sandbox
    environment:
      # The container sees the repo at its mount point, not at the host path Healix
      # knows. core must be told this via SANDBOX_REPO_PATH.
      SANDBOX_REPO_PATH: /workspace/demo-service
    ports:
      - "4000:4000"
    volumes:
      - ./demo-service:/workspace/demo-service
    networks:
      - sandbox_net
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  sandbox_net:
    internal: true

services:
  postgres:
    image: postgres:15-alpine
    container_name: healix-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: healix_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: healix_tenant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
